services:
  recorder:
    # Built by GitHub Actions (.github/workflows/deploy.yml).
    # Set IMAGE_TAG in .env to stay on one version, e.g. 1.0.0
    image: ghcr.io/pvlkrc/audio-recorder:${IMAGE_TAG:-latest}
    container_name: audio-recorder
    restart: unless-stopped
    init: true                # forwards "docker stop" to the app, so it can finish the file
    stop_grace_period: 15s
    env_file:
      - path: .env
        required: false
    environment:
      AUDIO_DEVICE: ${AUDIO_DEVICE:-auto}   # e.g. AUDIO_DEVICE=test docker compose up -d
      TZ: ${TZ:-Europe/Prague}              # local time in file names
    ports:
      - "${HOST_PORT:-8080}:8080"           # web page in your LAN (no login!)
    # Sound cards: mount /dev/snd as a folder and allow all ALSA devices
    # (major 116). This also works when you plug the USB card in later.
    device_cgroup_rules:
      - "c 116:* rmw"
    group_add:
      - audio
    volumes:
      - /dev/snd:/dev/snd
      - ./recordings:/recordings   # your recordings (Navidrome can read this folder)
      - ./data:/data               # settings (selected device, monitor on/off)

  # Cloudflare tunnel: HTTPS from the internet without opening ports.
  # Turned on by COMPOSE_PROFILES=tunnel and TUNNEL_TOKEN in .env.
  # In Cloudflare, point the public hostname to: http://audio-recorder:8080
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: audio-recorder-tunnel
    profiles: [tunnel]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - recorder
